[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here,
# and so does the compiler — the `wip` catalog this release publishes carries `kotlin`, which is why
# there is no kotlin version in this file to drift from the rest of the portfolio. The Kotlin plugins
# are applied as `wip.plugins.*`; a library published by one repository and read by another carries
# metadata a mismatched compiler refuses, so that version is not this repository's to choose.
sborka = "0.4.0.92"
exposed = "1.4.0"
kotlinx-coroutines = "1.11.0"
# Pinned to a major rather than latest: a test stand that silently changes its DBMS version
# answers a different question every few months.
postgres-driver = "42.7.13"
testcontainers = "2.0.5"
hikari = "7.0.2"
# The Kotlin/Native-capable driver. Pinned like the rest: it carries a Rust runtime, and a stand
# that changes its driver silently answers a different question every few months.
sqlx4k = "1.13.1"
# Test-only: the databases the SQLite corpus run opens are files, and a file has to be created on
# both targets from the same source.
okio = "3.18.2"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }

postgres-driver = { module = "org.postgresql:postgresql", version.ref = "postgres-driver" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

# The database-agnostic half of sqlx4k: `Driver`, `Transaction`, `Statement`, `ResultSet`. NOT a
# driver — see chronik-sqlx4k-sqlite/build.gradle.kts for why the store depends on this and not on
# `sqlx4k-sqlite`.
sqlx4k-core = { module = "io.github.smyrgeorge:sqlx4k", version.ref = "sqlx4k" }
sqlx4k-sqlite = { module = "io.github.smyrgeorge:sqlx4k-sqlite", version.ref = "sqlx4k" }

okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

[plugins]
sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
