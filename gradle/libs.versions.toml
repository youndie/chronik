[versions]
# The shared build conventions. One number: every sborka plugin below takes its version from here.
sborka = "0.4.0.43"
kotlin = "2.4.10"
exposed = "1.4.0"
kotlinx-coroutines = "1.11.0"
# Pinned to a major rather than latest: a test stand that silently changes its DBMS version
# answers a different question every few months.
postgres-driver = "42.7.13"
testcontainers = "2.0.5"
hikari = "7.0.2"

[libraries]
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

exposed-core = { group = "org.jetbrains.exposed", name = "exposed-core", version.ref = "exposed" }
exposed-jdbc = { group = "org.jetbrains.exposed", name = "exposed-jdbc", version.ref = "exposed" }

postgres-driver = { module = "org.postgresql:postgresql", version.ref = "postgres-driver" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }

sborkaKmp = { id = "io.github.youndie.sborka.kmp", version.ref = "sborka" }
sborkaJvm = { id = "io.github.youndie.sborka.jvm", version.ref = "sborka" }
sborkaLint = { id = "io.github.youndie.sborka.lint", version.ref = "sborka" }
sborkaPublish = { id = "io.github.youndie.sborka.publish", version.ref = "sborka" }
