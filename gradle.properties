kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.mpp.applyDefaultHierarchyTemplate=false

# The head of the version; CI appends the run number through -PVERSION. Plain `version`, which is
# what Gradle reads on its own and what sborka's `determine-version` action expects.
#
# THE HEAD NAMES THE NEXT RELEASE, never the last one, so it moves twice around a release:
#
# - Before it, when the release is not the number the head already names. 0.2.0 was such a case:
#   since 0.1.0 the library gained a target and a module — `linuxX64` on the core and the corpus
#   (#19), and `chronik-sqlx4k-sqlite` (#20) — and new variants change what resolves for whom, which
#   a patch number would hide. A head left at 0.1.0 would have kept producing 0.1.0.N, numbers that
#   sort below a released 0.2.0 while carrying newer code.
# - Right after it, to the next patch. In Maven's ordering (and Renovate's) `X.Y.Z.N` sorts ABOVE
#   `X.Y.Z`. Left at 0.2.0 after 0.2.0 went to Central from `v0.2.0`, the builds that followed went
#   out as `0.2.0.17` (the tagged commit) and up: named after a release they came after, and ranking
#   above it as if they were its newer copies.
#
# 0.2.1 and not 0.3.0: since 0.2.0 only the build, CI and docs moved, no API and no module. If the
# next release turns out to be a minor, its release PR moves the head there; `0.3.0` still sorts
# above every `0.2.1.N`.
version=0.2.1

# WHAT THIS REPOSITORY TELLS THE SHARED CONVENTIONS.
# `io.github.<login>.<library>` and not the bare `io.github.youndie`: one namespace per library, the
# way bochka, booblik and viddik already sit on Central. The bare one would work too -- a verified
# namespace covers what is under it -- but then every library shares a directory and a search result
# with every other.
sborka.group=io.github.youndie.chronik
sborka.repository=youndie/chronik
sborka.description=A durable timer for Kotlin: schedule an instant inside your own transaction, and the fact "it is time" leaves at least once.
sborka.inceptionYear=2026

# The oldest Java a consumer may be on — a decision rather than a side effect of whichever JDK the
# build ran on. chronik is meant to be scheduled from inside a consumer's transaction, so it has to
# be usable by whatever that consumer runs on; raising it is a breaking change for them and a
# one-line diff here.
sborka.jvmFloor=21

# ON, as sborka wants for a published library.
#
# Turned on immediately after the build migration rather than with it, so that the visibility
# keywords and whatever the migration broke do not share a diff. Cheap here and only here: the
# library is eight files today, and the neighbouring engine, which put this off, is now looking at
# 117 errors across 13 files as a task of its own.
sborka.explicitApi=true

# MAVEN CENTRAL. Applies the plugin that adds the javadoc jar and the detached signature per file
# that the portal requires and Reposilite never asked for; the signature follows the key rather than
# a second switch, so a snapshot still publishes without one.
#
# Uploading is not done from here: `central.yaml` in youndie/sborka takes the repository, the tree
# and the version, and the four portal secrets live there rather than once per library.
sborka.central=true
