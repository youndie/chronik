# From docs-bootstrap's templates/workflow-check.yaml, for the default layout - `docs/` inside this
# repository - with this repository's code gate inside the same `make check`. The Makefile at the
# root is its other half.
#
# THE VERSION OF THE CHECKS IS WRITTEN HERE AND NOWHERE ELSE: the ref in the `uses:` lines below.
# CI runs the checks at that ref because the runner resolves it; the Makefile reads the same line
# and fetches the same ref for a local `make check`. Renovate's github-actions manager bumps it, so a
# release of the checks arrives as one pull request that moves CI and every laptop together. Both
# jobs name the same ref, and the Makefile refuses to guess when they do not.
#
# Do not replace the action with copied scripts to save a network fetch. That is how one portfolio
# came to hold 18 copies of one script in three versions, eleven of them missing a guard that had
# been fixed upstream for weeks.

name: check

# **No path filters.** A filter saves seconds and buys red default branches. Two changes that are
# each harmless alone disagree once merged; a generated index diverges from its sources when
# something outside the listed paths moves; and a document at the root of the tree is exactly the
# one nobody remembers to add to the list, so the check that would have caught it never runs.
# Sixty documents are checked in seconds. There is nothing here worth economising on.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"          # Monday morning, for the anchors job below
  workflow_dispatch:

jobs:
  # The gate. The action runs `make check` - exactly the target a contributor runs, so that "green
  # here, red there" cannot become the normal state of affairs - and around it the two checks that
  # depend on the event: on a pull request, backlog item numbers against the base branch, BEFORE the
  # gate; on a push to the default branch, `status: draft` as an error. Why each sits where it does,
  # and when the first is only a backstop, is written next to the step in the action's action.yml.
  #
  # Checks of the project's own belong in the Makefile under `gate`, not as steps here: then a
  # contributor runs them too. Here that is `./gradlew check`, so the toolchain it needs is set up
  # before the action rather than after it.
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `make check` runs `./gradlew check` too, so the JDK is a prerequisite of the gate rather
      # than of a separate build job. One target, one thing to remember: the gate that is not
      # `make check` is the one that stops being run (B-13). BEFORE the action, because the action
      # is what runs `make check`.
      #
      # 25 is the toolchain sborka builds with, not the floor a consumer may be on (21,
      # `sborka.jvmFloor`). A newer JDK no longer lets a `java.*` call from a later release in
      # unnoticed: `sborka.kmp` and `sborka.jvm` compile against the floor's class library
      # (`-Xjdk-release` for Kotlin, `options.release` for Java), so such a call fails here and not
      # at the consumer's class loading.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - uses: youndie/docs-bootstrap@v0.3.5

  # The handover stand, in a job of its own because it is the one check `make check` deliberately
  # leaves out: it needs a working docker and the better part of a minute, and a contributor editing
  # a document has neither. Left only in the Makefile it would rot unseen, so it runs here on every
  # push and pull request — the claim it makes (a worker killed holding a timer loses it to another
  # instance, exactly once) is the reason the lease column exists at all.
  stand:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Docker is present on the GitHub-hosted Linux runners; the stand brings up its own Postgres.
      - run: make stand

      # The worker logs say which instance did what, and on a failure that is the first thing
      # anybody wants. They are useless when the run is green, hence the condition.
      - if: failure()
        run: cat /tmp/chronik-worker-*.log || true

  # The aimed mutation run, weekly rather than per push.
  #
  # It runs the suite once per mutant, so it is minutes rather than seconds — but the cadence is
  # chosen for what it guards against, not for the cost. A mutant survives when a test has been
  # weakened, and that happens inside a pull request whose own tests are green: nothing about it
  # looks wrong on the day. A weekly verdict finds it; a per-push one would mostly re-prove the same
  # eleven facts and teach people to skip a slow job.
  #
  # It DOES block, unlike the anchors below, because a survivor is a statement about this repository
  # and nobody else's: the boundary of time is unguarded, and no refactor elsewhere can cause that.
  mutants:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - run: make mutants

  # Separate from the gate, and on a schedule rather than on a pull request, because an anchor rots
  # when somebody refactors a **different** repository. A pull request here is the least likely
  # moment for one to break, and running it there trains people to ignore a red build they did not
  # cause. It also does not block: a path quoted *as obsolete* is indistinguishable from a live one
  # by machine, so the report is read by a person. Pass `target: report REPOS=repos ANCHORS_ARGS=--check`
  # once the stale list reaches zero.
  anchors:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # THE ANCHORS OF THIS REPOSITORY POINT AT FOUR OTHERS, which is why REPOS is not the default
      # `..` here. The research verifies its facts against petich, konekt, booblik and kompot and
      # cites them by path; a path is only checkable where the file is, so those four have to be on
      # disk. All four are public, so `secrets.GITHUB_TOKEN` — scoped to this repository — reaches them. A private
      # one would take the warning branch below every week without ever saying why.
      #
      # A repository that cannot be cloned is a warning rather than a failure: its anchors are
      # simply unchecked, and a red weekly build nobody caused is a build people learn to ignore.
      - run: |
          mkdir -p repos
          ln -s "$GITHUB_WORKSPACE" repos/chronik
          cd repos
          for r in petich konekt booblik kompot; do
            git clone --depth 1 --filter=blob:none \
              "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/$r.git" \
              || echo "::warning::$r is unreachable - its anchors were not checked"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `repos/` holds the four clones and a link to this checkout, so REPOS points there instead
      # of at `..`.
      - uses: youndie/docs-bootstrap@v0.3.5
        with:
          target: report REPOS=repos
